<div class="ship-wrapper" [class]="'size-' + size" [class.locked]="locked">
      <svg
        [attr.viewBox]="viewBox"
        xmlns="http://www.w3.org/2000/svg"
        class="ship-svg"
        [style.filter]="locked ? 'grayscale(1) opacity(0.35)' : 'drop-shadow(0 0 10px ' + color + '88)'">
        <ng-container [ngSwitch]="shipClass">
 
          <!-- SCOUT-->
          <ng-container *ngSwitchCase="'scout'">
            <polygon points="50,5 62,38 50,32 38,38" [attr.fill]="color" opacity="0.9"/>
            <polygon points="50,32 62,38 58,55 42,55 38,38" [attr.fill]="color" opacity="0.6"/>
            <polygon points="42,55 58,55 56,70 44,70" [attr.fill]="color" opacity="0.4"/>
            <ellipse cx="50" cy="38" rx="6" ry="4" fill="#fff" opacity="0.7"/>
            <line x1="38" y1="38" x2="25" y2="52" [attr.stroke]="color" stroke-width="2" opacity="0.5"/>
            <line x1="62" y1="38" x2="75" y2="52" [attr.stroke]="color" stroke-width="2" opacity="0.5"/>
          </ng-container>
 
          <!-- FRIGATE-->
          <ng-container *ngSwitchCase="'frigate'">
            <polygon points="50,4 60,20 60,65 40,65 40,20" [attr.fill]="color" opacity="0.7"/>
            <polygon points="50,4 60,20 68,28 60,28" [attr.fill]="color" opacity="0.9"/>
            <polygon points="50,4 40,20 32,28 40,28" [attr.fill]="color" opacity="0.9"/>
            <rect x="44" y="25" width="12" height="18" rx="2" fill="#fff" opacity="0.5"/>
            <rect x="40" y="55" width="20" height="6" rx="1" [attr.fill]="color" opacity="0.4"/>
            <circle cx="50" cy="34" r="4" fill="#fff" opacity="0.8"/>
            <line x1="32" y1="28" x2="22" y2="50" [attr.stroke]="color" stroke-width="2" opacity="0.5"/>
            <line x1="68" y1="28" x2="78" y2="50" [attr.stroke]="color" stroke-width="2" opacity="0.5"/>
          </ng-container>
 
          <!-- DESTROYER-->
          <ng-container *ngSwitchCase="'destroyer'">
            <polygon points="50,3 65,22 70,55 50,68 30,55 35,22" [attr.fill]="color" opacity="0.65"/>
            <polygon points="50,3 65,22 58,22" [attr.fill]="color" opacity="0.95"/>
            <polygon points="50,3 35,22 42,22" [attr.fill]="color" opacity="0.95"/>
            <rect x="44" y="22" width="12" height="22" rx="2" fill="#000" opacity="0.3"/>
            <ellipse cx="50" cy="33" rx="5" ry="5" fill="#fff" opacity="0.8"/>
            <polygon points="30,55 20,45 20,62 30,62" [attr.fill]="color" opacity="0.5"/>
            <polygon points="70,55 80,45 80,62 70,62" [attr.fill]="color" opacity="0.5"/>
            <rect x="47" y="60" width="6" height="12" rx="1" [attr.fill]="color" opacity="0.4"/>
          </ng-container>
 
          <!-- CRUISER-->
          <ng-container *ngSwitchCase="'cruiser'">
            <polygon points="50,2 68,18 75,50 68,72 32,72 25,50 32,18" [attr.fill]="color" opacity="0.6"/>
            <polygon points="50,2 68,18 60,18" [attr.fill]="color" opacity="0.9"/>
            <polygon points="50,2 32,18 40,18" [attr.fill]="color" opacity="0.9"/>
            <rect x="42" y="20" width="16" height="28" rx="3" fill="#000" opacity="0.25"/>
            <circle cx="50" cy="34" r="6" fill="#fff" opacity="0.75"/>
            <rect x="38" y="62" width="24" height="7" rx="2" [attr.fill]="color" opacity="0.35"/>
            <polygon points="25,50 12,42 12,58 25,58" [attr.fill]="color" opacity="0.55"/>
            <polygon points="75,50 88,42 88,58 75,58" [attr.fill]="color" opacity="0.55"/>
            <rect x="46" y="69" width="8" height="14" rx="1" [attr.fill]="color" opacity="0.4"/>
          </ng-container>
 
          <!-- BATTLESHIP-->
          <ng-container *ngSwitchCase="'battleship'">
            <polygon points="50,1 72,14 80,48 72,78 28,78 20,48 28,14" [attr.fill]="color" opacity="0.55"/>
            <polygon points="50,1 72,14 62,14" [attr.fill]="color" opacity="0.95"/>
            <polygon points="50,1 28,14 38,14" [attr.fill]="color" opacity="0.95"/>
            <rect x="41" y="16" width="18" height="32" rx="3" fill="#000" opacity="0.2"/>
            <circle cx="50" cy="32" r="7" fill="#fff" opacity="0.7"/>
            <polygon points="20,48 5,36 5,60 20,60" [attr.fill]="color" opacity="0.6"/>
            <polygon points="80,48 95,36 95,60 80,60" [attr.fill]="color" opacity="0.6"/>
            <polygon points="28,14 15,8 18,22 28,20" [attr.fill]="color" opacity="0.5"/>
            <polygon points="72,14 85,8 82,22 72,20" [attr.fill]="color" opacity="0.5"/>
            <rect x="44" y="72" width="12" height="16" rx="2" [attr.fill]="color" opacity="0.4"/>
          </ng-container>
 
          <!-- DREADNOUGHT-->
          <ng-container *ngSwitchCase="'dreadnought'">
            <polygon points="50,0 76,12 86,50 76,82 50,90 24,82 14,50 24,12" [attr.fill]="color" opacity="0.5"/>
            <polygon points="50,0 76,12 64,12" [attr.fill]="color" opacity="0.95"/>
            <polygon points="50,0 24,12 36,12" [attr.fill]="color" opacity="0.95"/>
            <rect x="40" y="14" width="20" height="38" rx="4" fill="#000" opacity="0.2"/>
            <circle cx="50" cy="33" r="9" fill="#fff" opacity="0.65"/>
            <circle cx="50" cy="33" r="5" [attr.fill]="color" opacity="0.9"/>
            <polygon points="14,50 0,36 0,64 14,64" [attr.fill]="color" opacity="0.65"/>
            <polygon points="86,50 100,36 100,64 86,64" [attr.fill]="color" opacity="0.65"/>
            <polygon points="24,12 10,4 12,20 24,18" [attr.fill]="color" opacity="0.55"/>
            <polygon points="76,12 90,4 88,20 76,18" [attr.fill]="color" opacity="0.55"/>
            <rect x="42" y="82" width="16" height="15" rx="2" [attr.fill]="color" opacity="0.4"/>
          </ng-container>
 
          <!-- CAPITAL-->
          <ng-container *ngSwitchCase="'capital'">
            <polygon points="50,0 80,10 92,50 80,86 50,96 20,86 8,50 20,10" [attr.fill]="color" opacity="0.45"/>
            <polygon points="50,0 80,10 66,10" [attr.fill]="color" opacity="0.98"/>
            <polygon points="50,0 20,10 34,10" [attr.fill]="color" opacity="0.98"/>
            <rect x="38" y="12" width="24" height="44" rx="4" fill="#000" opacity="0.2"/>
            <circle cx="50" cy="34" r="12" fill="#fff" opacity="0.55"/>
            <circle cx="50" cy="34" r="7" [attr.fill]="color" opacity="0.95"/>
            <circle cx="50" cy="34" r="3" fill="#fff" opacity="1"/>
            <polygon points="8,50 0,34 0,66 8,66" [attr.fill]="color" opacity="0.7"/>
            <polygon points="92,50 100,34 100,66 92,66" [attr.fill]="color" opacity="0.7"/>
            <polygon points="20,10 4,2 6,18 20,16" [attr.fill]="color" opacity="0.6"/>
            <polygon points="80,10 96,2 94,18 80,16" [attr.fill]="color" opacity="0.6"/>
            <polygon points="20,86 4,96 6,80 20,82" [attr.fill]="color" opacity="0.5"/>
            <polygon points="80,86 96,96 94,80 80,82" [attr.fill]="color" opacity="0.5"/>
            <rect x="44" y="88" width="12" height="12" rx="2" [attr.fill]="color" opacity="0.5"/>
          </ng-container>
 
        </ng-container>
      </svg>
      <div class="lock-overlay" *ngIf="locked">🔒</div>
    </div>
